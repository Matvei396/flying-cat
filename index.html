<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Летающая Кошка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;font-family:sans-serif;color:#fff;overflow:hidden;touch-action:none;position:fixed;width:100%;height:100%}
#startMenu{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#2a2a4e);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000;padding:20px}
#startMenu.hidden{display:none}
.menu-title{font-size:clamp(32px,8vw,72px);font-weight:bold;background:linear-gradient(135deg,#ffd700,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;text-align:center}
.menu-subtitle{font-size:clamp(14px,3vw,20px);color:#aaa;margin-bottom:30px;text-align:center}
.menu-buttons{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.menu-btn{padding:14px;font-size:18px;font-weight:bold;border:none;border-radius:12px;cursor:pointer}
.menu-btn.play{background:linear-gradient(135deg,#ffd700,#ffb800);color:#000}
.menu-btn.levels{background:linear-gradient(135deg,#ff6b9d,#ff4081);color:#fff}
.menu-btn.skins{background:linear-gradient(135deg,#9c27b0,#673ab7);color:#fff}
.menu-btn.achievements{background:linear-gradient(135deg,#00bcd4,#0097a7);color:#fff}
.menu-btn.leaderboard{background:linear-gradient(135deg,#4169e1,#1e90ff);color:#fff}
.nickname-container{position:absolute;bottom:30px;left:20px;right:20px}
.nickname-label{font-size:14px;color:#aaa;margin-bottom:8px}
.nickname-input{padding:12px;font-size:18px;background:rgba(255,255,255,0.1);border:2px solid #ffd700;border-radius:8px;color:#fff;width:100%}
#countdown{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:1999}
#countdown.active{display:flex}
.countdown-number{font-size:150px;font-weight:bold;color:#ffd700}
.countdown-number.go{color:#00ff00}
#gameContainer{position:relative;width:100%;height:100%;display:none}
#gameContainer.active{display:block}
canvas{display:block;background:linear-gradient(#87ceeb,#c9e7ff);width:100%;height:100%}
#joystick{position:fixed;bottom:80px;left:80px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.2);border:3px solid rgba(255,255,255,0.4);display:none;z-index:100}
#joystick.active{display:block}
#joystickKnob{width:50px;height:50px;border-radius:50%;background:rgba(255,215,0,0.8);border:2px solid #ffd700;position:absolute;top:35px;left:35px}
.action-buttons{position:fixed;bottom:20px;right:20px;display:none;gap:10px;z-index:100}
.action-buttons.active{display:flex}
.action-btn{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,0.5);border:2px solid #ffd700;color:#fff;font-size:24px;display:flex;justify-content:center;align-items:center}
#gameOverScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:1500;padding:20px}
#gameOverScreen.active{display:flex}
.game-over-title{font-size:clamp(40px,10vw,70px);font-weight:bold;margin-bottom:20px;text-align:center}
.game-over-title.win{color:#ffd700}
.game-over-title.lose{color:#ff4444}
.game-over-stats{font-size:18px;color:#fff;margin-bottom:20px;text-align:center}
.game-over-reward{font-size:24px;color:#ffd700;margin-bottom:30px;text-align:center;font-weight:bold}
.game-over-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#2a2a3e;border:3px solid #ffd700;border-radius:12px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 20px;color:#ffd700;text-align:center;font-size:20px}
.modal input{width:100%;padding:12px;font-size:16px;background:#1a1a2e;border:2px solid #555;border-radius:6px;color:#fff;margin-bottom:15px}
.modal button{padding:12px 20px;font-size:16px;background:#ffd700;color:#000;border:none;border-radius:6px;font-weight:bold;margin:5px}
.modal button.cancel{background:#555;color:#fff}
.levels-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.level-card{background:#1a1a2e;border:2px solid #444;border-radius:10px;padding:15px;text-align:center;cursor:pointer;position:relative}
.level-card:hover{border-color:#ffd700}
.level-card.completed{border-color:#2ecc71;background:#1a3a2e}
.level-card.locked{opacity:0.5;cursor:not-allowed}
.level-card.locked::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px}
.level-icon{font-size:36px;margin-bottom:8px}
.level-name{font-weight:bold;font-size:14px;margin-bottom:4px}
.level-desc{font-size:11px;color:#aaa;margin-bottom:4px}
.level-reward{font-size:12px;color:#ffd700;font-weight:bold}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.skin-card{background:#1a1a2e;border:2px solid #444;border-radius:8px;padding:8px;text-align:center}
.skin-card.selected{border-color:#ffd700;background:#3a3a4e}
.skin-icon{font-size:32px}
.skin-name{font-size:11px;font-weight:bold;margin-top:4px}
.skin-price{color:#ffd700;font-size:10px}
.achievements-list{display:flex;flex-direction:column;gap:10px}
.achievement-item{background:#1a1a2e;border:2px solid #444;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px}
.achievement-item.unlocked{border-color:#ffd700;background:#3a3a4e}
.achievement-icon{font-size:30px;min-width:40px;text-align:center}
.achievement-info{flex:1}
.achievement-title{font-weight:bold;color:#fff;margin-bottom:4px}
.achievement-desc{font-size:12px;color:#aaa}
.achievement-item.locked .achievement-title{color:#666}
.admin-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:3px solid #ff00ff;border-radius:12px;padding:20px;z-index:1001;width:90%;max-width:350px}
.admin-panel.active{display:block}
.admin-btn{display:block;width:100%;padding:12px;margin:8px 0;font-size:14px;background:#2a2a3e;color:#fff;border:2px solid #ff00ff;border-radius:6px}
.admin-close{background:#c0392b;border-color:#e74c3c}
.dev-badge{display:none;position:fixed;top:10px;left:10px;background:linear-gradient(135deg,#ff00ff,#00ffff);color:#000;font-weight:bold;font-size:12px;padding:6px 12px;border-radius:12px;z-index:999}
.dev-badge.active{display:block}
.wall-menu{background:rgba(0,0,0,0.9);border:3px solid #ffd700;border-radius:12px;padding:20px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1100;min-width:280px;text-align:center}
.wall-menu h3{color:#ffd700;margin-bottom:15px;font-size:18px}
.wall-menu p{color:#fff;margin-bottom:15px;font-size:14px}
.wall-menu-buttons{display:flex;gap:10px;justify-content:center}
.wall-menu-buttons button{padding:10px 20px;font-size:14px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
.wall-menu-buttons .delete-btn{background:#c0392b;color:#fff}
.wall-menu-buttons .cancel-btn{background:#555;color:#fff}
#restartBtn{position:fixed;top:10px;right:10px;width:50px;height:50px;border-radius:50%;background:rgba(255,0,0,0.7);border:2px solid #ff4444;color:#fff;font-size:24px;display:none;justify-content:center;align-items:center;z-index:100}
#restartBtn.active{display:flex}
</style>
</head>
<body>

<div id="startMenu">
<div class="menu-title">🐱 ЛЕТАЮЩАЯ КОШКА 🐟</div>
<div class="menu-subtitle">Собирай рыбок, расти, побеждай собак!</div>
<div class="menu-buttons">
<button class="menu-btn levels" id="btnLevels">🎮 УРОВНИ</button>
<button class="menu-btn skins" id="btnSkinsMenu">👕 СКИНЫ</button>
<button class="menu-btn achievements" id="btnAchievementsMenu">🏆 ДОСТИЖЕНИЯ</button>
<button class="menu-btn leaderboard" id="btnLeaderboard">📊 ЛИДЕРБОРД</button>
</div>
<div class="nickname-container">
<div class="nickname-label">Твой ник:</div>
<input type="text" class="nickname-input" id="nicknameInput" placeholder="Введи ник..." maxlength="15">
</div>
</div>

<div id="countdown"><div class="countdown-number" id="countdownText">3</div></div>

<div id="gameContainer">
<canvas id="game"></canvas>
<div id="joystick"><div id="joystickKnob"></div></div>
<div class="action-buttons" id="actionButtons">
<div class="action-btn" id="btnSkins">👕</div>
<div class="action-btn" id="btnEndings">🏆</div>
</div>
<button id="restartBtn">🔄</button>
</div>

<div id="gameOverScreen">
<div class="game-over-title" id="gameOverTitle">ПОБЕДА!</div>
<div class="game-over-stats" id="gameOverStats"></div>
<div class="game-over-reward" id="gameOverReward"></div>
<div class="game-over-buttons" id="gameOverButtons"></div>
</div>

<div class="modal-overlay" id="levelsModal">
<div class="modal">
<h2> ВЫБОР УРОВНЯ</h2>
<div class="levels-grid" id="levelsGrid"></div>
<button id="closeLevels" style="width:100%">Закрыть</button>
</div>
</div>

<div class="modal-overlay" id="passwordModal">
<div class="modal">
<h2>🔐 Доступ</h2>
<input type="password" id="passwordInput" placeholder="Пароль" maxlength="20">
<div style="text-align:center">
<button id="passwordOk">OK</button>
<button class="cancel" id="passwordCancel">Отмена</button>
</div>
</div>
</div>

<div class="modal-overlay" id="skinModal">
<div class="modal">
<h2>👕 Магазин Скинов</h2>
<div style="text-align:center;color:#ffd700;font-weight:bold;margin-bottom:15px">Баланс: <span id="shopBalance">0</span> </div>
<div class="skins-grid" id="skinsGrid"></div>
<button id="promoBtn" style="width:100%;background:#3498db;color:#fff;margin-bottom:10px">🎁 Промокод</button>
<button id="closeSkinShop" style="width:100%">Закрыть</button>
<button id="openAdminFromShop" style="width:100%;background:#8e44ad;color:#fff;margin-top:10px">🛠 Админка</button>
</div>
</div>

<div class="modal-overlay" id="promoModal">
<div class="modal">
<h2>🎁 Промокод</h2>
<input type="text" id="promoInput" placeholder="Код..." maxlength="20">
<div style="text-align:center">
<button id="promoOk">Активировать</button>
<button class="cancel" id="promoCancel">Отмена</button>
</div>
</div>
</div>

<div class="modal-overlay" id="achievementsModal">
<div class="modal">
<h2>🏆 ДОСТИЖЕНИЯ</h2>
<div class="achievements-list" id="achievementsList"></div>
<button id="closeAchievements" style="width:100%;margin-top:20px">Закрыть</button>
</div>
</div>

<div class="modal-overlay" id="leaderboardModal">
<div class="modal">
<h2>📊 ЛИДЕРБОРД</h2>
<div id="leaderboardContent"></div>
<button id="closeLeaderboard" style="width:100%;margin-top:20px">Закрыть</button>
</div>
</div>

<div class="admin-panel" id="adminPanel">
<h2 style="color:#ff00ff;text-align:center">🛠 АДМИНКА</h2>
<button class="admin-btn" id="btnImmortal">🛡️ Бессмертие</button>
<button class="admin-btn" id="btnAddMoney">💰 +100</button>
<button class="admin-btn" id="btnAddWeight">⚖ +50 кг</button>
<button class="admin-btn" id="btnBreakWalls">💥 Стены</button>
<button class="admin-btn" id="btnKillDogs"> Собаки</button>
<button class="admin-btn" id="btnWin">🏆 Победа</button>
<button class="admin-btn admin-close" id="btnCloseAdmin">Закрыть</button>
</div>

<div class="dev-badge" id="devBadge">👑 DEV</div>

<div class="wall-menu" id="wallMenu" style="display:none">
<h3 id="wallMenuTitle">Удалить стену?</h3>
<p id="wallMenuText"></p>
<div class="wall-menu-buttons">
<button class="delete-btn" id="wallDeleteBtn">Удалить</button>
<button class="cancel-btn" id="wallCancelBtn">Отмена</button>
</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const LEADERBOARD_KEY = 'cat_leaderboard_v7';
const NICKNAME_KEY = 'cat_nickname';
const LEVELS_KEY = 'cat_levels_completed';
let currentNickname = localStorage.getItem(NICKNAME_KEY) || '';
document.getElementById('nicknameInput').value = currentNickname;

document.getElementById('nicknameInput').addEventListener('input', function(e) {
  currentNickname = e.target.value.trim() || 'Игрок';
  localStorage.setItem(NICKNAME_KEY, currentNickname);
});

function getLeaderboard() {
  return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
}

function saveLeaderboard(lb) {
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(lb));
}

function addToLeaderboard(name, weight, isWin, level) {
  const lb = getLeaderboard();
  lb.push({
    name: name || 'Игрок',
    weight: Math.round(weight),
    win: isWin,
    level: level || 1,
    date: new Date().toLocaleDateString('ru-RU')
  });
  lb.sort(function(a, b) { return b.weight - a.weight; });
  saveLeaderboard(lb.slice(0, 10));
}

function getCompletedLevels() {
  return JSON.parse(localStorage.getItem(LEVELS_KEY) || '[]');
}

function markLevelCompleted(levelId) {
  const completed = getCompletedLevels();
  if (completed.indexOf(levelId) === -1) {
    completed.push(levelId);
    localStorage.setItem(LEVELS_KEY, JSON.stringify(completed));
  }
}

function isLevelUnlocked(levelId) {
  if (levelId === 1) return true;
  const completed = getCompletedLevels();
  return completed.indexOf(levelId - 1) !== -1;
}

const LEVEL_REWARDS = {
  1: 50,
  2: 100,
  3: 150,
  4: 200,
  5: 300
};

const ENDINGS = {
  death: { id: 'death', title: 'Смерть', desc: 'Собаки победили', icon: '💀', unlocked: false },
  level1: { id: 'level1', title: 'Новичок', desc: 'Прошла уровень 1', icon: '🥉', unlocked: false },
  level2: { id: 'level2', title: 'Любитель', desc: 'Прошла уровень 2', icon: '🥈', unlocked: false },
  level3: { id: 'level3', title: 'Профи', desc: 'Прошла уровень 3', icon: '🥇', unlocked: false },
  level4: { id: 'level4', title: 'Мастер', desc: 'Прошла уровень 4', icon: '', unlocked: false },
  level5: { id: 'level5', title: 'Легенда', desc: 'Прошла уровень 5', icon: '🏆', unlocked: false }
};

const ENDINGS_KEY = 'cat_endings_v7';

function loadEndings() {
  const saved = localStorage.getItem(ENDINGS_KEY);
  if (saved) {
    const data = JSON.parse(saved);
    for (const key in data) {
      if (ENDINGS[key]) ENDINGS[key].unlocked = data[key];
    }
  }
}

function saveEndings() {
  const data = {};
  for (const key in ENDINGS) {
    data[key] = ENDINGS[key].unlocked;
  }
  localStorage.setItem(ENDINGS_KEY, JSON.stringify(data));
}

function unlockEnding(id) {
  if (ENDINGS[id] && !ENDINGS[id].unlocked) {
    ENDINGS[id].unlocked = true;
    saveEndings();
  }
}

loadEndings();

const LEVELS = [
  {
    id: 1,
    name: 'Лёгкий',
    icon: '🟢',
    desc: '2 стены: 30, 50 кг',
    fishes: 15,
    wetFood: 0,
    saws: 0,
    coins: 10,
    dogs: 2,
    walls: [
      { need: 30, color: '#8B4513' },
      { need: 50, color: '#666' }
    ]
  },
  {
    id: 2,
    name: 'Средний',
    icon: '🟡',
    desc: '3 стены + пилы + корм',
    fishes: 18,
    wetFood: 5,
    saws: 3,
    coins: 12,
    dogs: 3,
    walls: [
      { need: 50, color: '#8B4513' },
      { need: 80, color: '#666' },
      { need: 100, color: '#222' }
    ]
  },
  {
    id: 3,
    name: 'Сложный',
    icon: '🟠',
    desc: '3 стены + больше пил',
    fishes: 22,
    wetFood: 7,
    saws: 5,
    coins: 15,
    dogs: 4,
    walls: [
      { need: 70, color: '#8B4513' },
      { need: 110, color: '#666' },
      { need: 140, color: '#222' }
    ]
  },
  {
    id: 4,
    name: 'Эксперт',
    icon: '',
    desc: '4 стены + много пил',
    fishes: 28,
    wetFood: 9,
    saws: 7,
    coins: 18,
    dogs: 5,
    walls: [
      { need: 80, color: '#8B4513' },
      { need: 120, color: '#666' },
      { need: 160, color: '#222' },
      { need: 200, color: '#000' }
    ]
  },
  {
    id: 5,
    name: 'Невозможный',
    icon: '⚫',
    desc: '5 стен + максимум пил',
    fishes: 35,
    wetFood: 12,
    saws: 10,
    coins: 20,
    dogs: 6,
    walls: [
      { need: 100, color: '#8B4513' },
      { need: 150, color: '#666' },
      { need: 200, color: '#222' },
      { need: 250, color: '#000' },
      { need: 300, color: '#330000' }
    ]
  }
];

let currentLevel = 1;
let gameStarted = false;
let selectedWall = null;

document.getElementById('btnLevels').addEventListener('click', function() {
  renderLevels();
  document.getElementById('levelsModal').classList.add('active');
});

document.getElementById('closeLevels').addEventListener('click', function() {
  document.getElementById('levelsModal').classList.remove('active');
});

function renderLevels() {
  const grid = document.getElementById('levelsGrid');
  const completed = getCompletedLevels();
  grid.innerHTML = '';
  
  for (let i = 0; i < LEVELS.length; i++) {
    const level = LEVELS[i];
    const isCompleted = completed.indexOf(level.id) !== -1;
    const isUnlocked = isLevelUnlocked(level.id);
    const reward = LEVEL_REWARDS[level.id];
    
    const card = document.createElement('div');
    card.className = 'level-card';
    if (isCompleted) card.className += ' completed';
    if (!isUnlocked) card.className += ' locked';
    
    card.innerHTML = '<div class="level-icon">' + level.icon + '</div><div class="level-name">' + level.name + '</div><div class="level-desc">' + level.desc + '</div><div class="level-reward"> ' + reward + '</div>' + (isCompleted ? '<div style="color:#2ecc71;font-size:11px;margin-top:4px">✅ Пройден</div>' : '');
    
    if (isUnlocked) {
      card.onclick = (function(lvl) {
        return function() {
          currentLevel = lvl.id;
          document.getElementById('levelsModal').classList.remove('active');
          startCountdown();
        };
      })(level);
    }
    
    grid.appendChild(card);
  }
}

document.getElementById('btnSkinsMenu').addEventListener('click', function() {
  document.getElementById('skinModal').classList.add('active');
  renderSkinShop();
});

document.getElementById('btnAchievementsMenu').addEventListener('click', function() {
  renderAchievements();
  document.getElementById('achievementsModal').classList.add('active');
});

document.getElementById('btnLeaderboard').addEventListener('click', function() {
  renderLeaderboard();
  document.getElementById('leaderboardModal').classList.add('active');
});

document.getElementById('closeSkinShop').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
});

document.getElementById('closeAchievements').addEventListener('click', function() {
  document.getElementById('achievementsModal').classList.remove('active');
});

document.getElementById('closeLeaderboard').addEventListener('click', function() {
  document.getElementById('leaderboardModal').classList.remove('active');
});

function renderAchievements() {
  const list = document.getElementById('achievementsList');
  list.innerHTML = '';
  for (const key in ENDINGS) {
    const e = ENDINGS[key];
    const item = document.createElement('div');
    item.className = 'achievement-item ' + (e.unlocked ? 'unlocked' : 'locked');
    item.innerHTML = '<div class="achievement-icon">' + (e.unlocked ? e.icon : '🔒') + '</div><div class="achievement-info"><div class="achievement-title">' + (e.unlocked ? e.title : '???') + '</div><div class="achievement-desc">' + (e.unlocked ? e.desc : 'Ещё не получено') + '</div></div>';
    list.appendChild(item);
  }
}

function renderLeaderboard() {
  const lb = getLeaderboard();
  const content = document.getElementById('leaderboardContent');
  if (lb.length === 0) {
    content.innerHTML = '<div style="text-align:center;color:#666;padding:30px">Пока нет рекордов</div>';
    return;
  }
  let html = '<table style="width:100%;border-collapse:collapse">';
  for (let i = 0; i < lb.length; i++) {
    const entry = lb[i];
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    html += '<tr><td style="padding:8px;border-bottom:1px solid #333">' + medal + '</td><td style="padding:8px;border-bottom:1px solid #333">' + entry.name + '</td><td style="padding:8px;border-bottom:1px solid #333">' + entry.weight + 'кг</td><td style="padding:8px;border-bottom:1px solid #333">Ур.' + (entry.level || 1) + '</td><td style="padding:8px;border-bottom:1px solid #333">' + (entry.win ? '✅' : '') + '</td></tr>';
  }
  html += '</table>';
  content.innerHTML = html;
}

function startCountdown() {
  document.getElementById('startMenu').classList.add('hidden');
  document.getElementById('gameContainer').classList.add('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  const countdownEl = document.getElementById('countdown');
  const textEl = document.getElementById('countdownText');
  countdownEl.classList.add('active');
  
  let count = 3;
  textEl.textContent = count;
  
  const interval = setInterval(function() {
    count--;
    if (count > 0) {
      textEl.textContent = count;
    } else if (count === 0) {
      textEl.textContent = 'GO!';
      textEl.className = 'countdown-number go';
    } else {
      clearInterval(interval);
      countdownEl.classList.remove('active');
      gameStarted = true;
      document.getElementById('joystick').classList.add('active');
      document.getElementById('actionButtons').classList.add('active');
      document.getElementById('restartBtn').classList.add('active');
      initGame();
    }
  }, 1000);
}

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystickKnob');
let joystickActive = false;
let joystickX = 0, joystickY = 0;

joystick.addEventListener('touchstart', function(e) {
  e.preventDefault();
  joystickActive = true;
});

joystick.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!joystickActive) return;
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const touch = e.touches[0];
  let dx = touch.clientX - centerX;
  let dy = touch.clientY - centerY;
  const distance = Math.min(Math.hypot(dx, dy), 50);
  const angle = Math.atan2(dy, dx);
  dx = Math.cos(angle) * distance;
  dy = Math.sin(angle) * distance;
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  joystickX = dx / 50;
  joystickY = dy / 50;
});

joystick.addEventListener('touchend', function(e) {
  e.preventDefault();
  joystickActive = false;
  knob.style.transform = 'translate(0,0)';
  joystickX = 0;
  joystickY = 0;
});

canvas.addEventListener('click', function(e) {
  if (!gameStarted || win || death) return;
  
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;
  
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken) continue;
    if (clickX >= w.x && clickX <= w.x + w.w && clickY >= w.y && clickY <= w.y + w.h) {
      selectedWall = w;
      document.getElementById('wallMenuTitle').textContent = 'Удалить стену #' + w.id + '?';
      document.getElementById('wallMenuText').textContent = 'Нужно ' + w.need + ' кг, у тебя ' + Math.round(cat.weight) + ' кг';
      document.getElementById('wallMenu').style.display = 'block';
      break;
    }
  }
});

document.getElementById('wallDeleteBtn').addEventListener('click', function() {
  if (selectedWall && cat.weight >= selectedWall.need) {
    selectedWall.broken = true;
    spawnParticles(selectedWall.x + selectedWall.w / 2, cat.y, selectedWall.color, 30);
  } else if (selectedWall) {
    alert('Недостаточно веса! Нужно ' + selectedWall.need + ' кг');
  }
  document.getElementById('wallMenu').style.display = 'none';
  selectedWall = null;
});

document.getElementById('wallCancelBtn').addEventListener('click', function() {
  document.getElementById('wallMenu').style.display = 'none';
  selectedWall = null;
});

let cat, fishes, coins, dogs, walls, particles, win, death, saws, wetFoods;
let adminUsed = false;
const DOG_EAT_THRESHOLD = 50;

function initGame() {
  const level = LEVELS[currentLevel - 1];
  
  cat = {
    x: canvas.width * 0.1,
    y: canvas.height / 2,
    vx: 0, vy: 0,
    weight: 25, fishes: 0,
    wingPhase: 0, hurtTimer: 0, dogHits: 0, sawCooldown: 0
  };
  
  fishes = [];
  for (let i = 0; i < level.fishes; i++) {
    fishes.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.65,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 14, bob: Math.random() * Math.PI * 2, eaten: false
    });
  }
  
  wetFoods = [];
  for (let i = 0; i < level.wetFood; i++) {
    wetFoods.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.65,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 16, bob: Math.random() * Math.PI * 2, eaten: false
    });
  }
  
  saws = [];
  for (let i = 0; i < level.saws; i++) {
    saws.push({
      x: canvas.width * 0.15 + Math.random() * canvas.width * 0.6,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 20,
      angle: 0,
      speed: (Math.random() > 0.5 ? 1 : -1) * (0.05 + Math.random() * 0.05),
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5
    });
  }
  
  coins = [];
  for (let i = 0; i < level.coins; i++) {
    coins.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.7,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 10, collected: false
    });
  }
  
  dogs = [];
  for (let i = 0; i < level.dogs; i++) {
    dogs.push({
      x: canvas.width * 0.2 + Math.random() * canvas.width * 0.5,
      y: canvas.height * 0.2 + Math.random() * canvas.height * 0.6,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      r: 16 + Math.random() * 4,
      cooldown: 0,
      dir: Math.random() > 0.5 ? 1 : -1,
      phase: Math.random() * Math.PI * 2,
      alive: true
    });
  }
  
  walls = [];
  const wallStartX = canvas.width * 0.75;
  const wallSpacing = canvas.width * 0.05;
  for (let i = 0; i < level.walls.length; i++) {
    walls.push({
      x: wallStartX + i * wallSpacing,
      y: 0,
      w: 15,
      h: canvas.height,
      need: level.walls[i].need,
      color: level.walls[i].color,
      broken: false,
      id: i + 1
    });
  }
  
  particles = [];
  win = false;
  death = false;
  adminUsed = false;
}

function getCatRadius() {
  return 20 + cat.weight * 0.2;
}

function spawnParticles(x, y, color, count) {
  count = count || 12;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 25 + Math.random() * 15,
      maxLife: 40,
      color: color,
      size: 2 + Math.random() * 4
    });
  }
}

function update() {
  if (!gameStarted || win || death) return;
  
  const catR = getCatRadius();
  const speed = 0.5;
  
  cat.vx += joystickX * speed;
  cat.vy += joystickY * speed;
  cat.vx *= 0.92;
  cat.vy *= 0.92;
  cat.x += cat.vx;
  cat.y += cat.vy;
  
  if (cat.x - catR < 0) { cat.x = catR; cat.vx = 0; }
  if (cat.y - catR < 0) { cat.y = catR; cat.vy = 0; }
  if (cat.y + catR > canvas.height) { cat.y = canvas.height - catR; cat.vy = 0; }
  
  cat.wingPhase += 0.3;
  if (cat.hurtTimer > 0) cat.hurtTimer--;
  if (cat.sawCooldown > 0) cat.sawCooldown--;

  for (let i = 0; i < fishes.length; i++) {
    const f = fishes[i];
    if (f.eaten) continue;
    f.bob += 0.08;
    if (Math.hypot(f.x - cat.x, f.y - cat.y) < catR + f.r) {
      f.eaten = true;
      cat.fishes++;
      cat.weight += 5;
      spawnParticles(f.x, f.y, '#ffcc33', 10);
    }
  }

  for (let i = 0; i < wetFoods.length; i++) {
    const f = wetFoods[i];
    if (f.eaten) continue;
    f.bob += 0.08;
    if (Math.hypot(f.x - cat.x, f.y - cat.y) < catR + f.r) {
      f.eaten = true;
      cat.weight += 15;
      spawnParticles(f.x, f.y, '#ff6600', 12);
    }
  }

  for (let i = 0; i < saws.length; i++) {
    const s = saws[i];
    s.angle += s.speed;
    s.x += s.vx;
    s.y += s.vy;
    if (s.x < s.r || s.x > canvas.width * 0.75 - s.r) s.vx *= -1;
    if (s.y < s.r || s.y > canvas.height - s.r) s.vy *= -1;
    
    if (cat.sawCooldown <= 0 && Math.hypot(s.x - cat.x, s.y - cat.y) < catR + s.r) {
      cat.weight = Math.max(10, cat.weight - 10);
      cat.sawCooldown = 60;
      cat.hurtTimer = 20;
      spawnParticles(cat.x, cat.y, '#ff0000', 15);
      if (cat.weight <= 10) {
        death = true;
        unlockEnding('death');
        addToLeaderboard(currentNickname, cat.weight, false, currentLevel);
        setTimeout(function() { showGameOver(false); }, 1000);
      }
    }
  }

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected) continue;
    if (Math.hypot(c.x - cat.x, c.y - cat.y) < catR + c.r) {
      c.collected = true;
      money++;
      saveSkinData();
      spawnParticles(c.x, c.y, '#ffd700', 8);
    }
  }

  for (let i = 0; i < dogs.length; i++) {
    const d = dogs[i];
    if (!d.alive) continue;
    d.phase += 0.02;
    const toCatX = cat.x - d.x;
    const toCatY = cat.y - d.y;
    const dist = Math.hypot(toCatX, toCatY) || 1;
    d.vx += (toCatX / dist) * 0.03 + Math.sin(d.phase) * 0.05;
    d.vy += (toCatY / dist) * 0.03 + Math.cos(d.phase * 1.3) * 0.05;
    d.vx *= 0.97;
    d.vy *= 0.97;
    const spd = Math.hypot(d.vx, d.vy);
    if (spd > 2.5) { d.vx *= 2.5 / spd; d.vy *= 2.5 / spd; }
    d.x += d.vx;
    d.y += d.vy;
    d.dir = d.vx >= 0 ? 1 : -1;
    
    if (d.x < d.r) { d.x = d.r; d.vx *= -1; }
    if (d.x > canvas.width * 0.75) { d.x = canvas.width * 0.75; d.vx *= -1; }
    if (d.y < d.r) { d.y = d.r; d.vy *= -1; }
    if (d.y > canvas.height - d.r) { d.y = canvas.height - d.r; d.vy *= -1; }
    
    if (d.cooldown > 0) d.cooldown--;
    if (d.cooldown <= 0 && Math.hypot(d.x - cat.x, d.y - cat.y) < catR + d.r) {
      if (cat.weight >= DOG_EAT_THRESHOLD) {
        d.alive = false;
        cat.weight += 15;
        spawnParticles(d.x, d.y, '#ff6600', 20);
      } else {
        if (isImmortal) {
          d.vx = -d.vx * 3;
          d.vy = -d.vy * 3;
          d.cooldown = 30;
          spawnParticles(cat.x, cat.y, '#64c8ff', 6);
        } else {
          if (cat.fishes > 0) {
            cat.fishes--;
            cat.weight = Math.max(25, cat.weight - 5);
            spawnParticles(cat.x, cat.y, '#ff4444', 8);
          }
          cat.hurtTimer = 20;
          cat.dogHits++;
          d.cooldown = 60;
          d.vx = -d.vx * 3;
          d.vy = -d.vy * 3;
          if (cat.dogHits >= 5) {
            death = true;
            unlockEnding('death');
            addToLeaderboard(currentNickname, cat.weight, false, currentLevel);
            setTimeout(function() { showGameOver(false); }, 1500);
          }
        }
      }
    }
  }

  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken) continue;
    const cx = Math.max(w.x, Math.min(cat.x, w.x + w.w));
    const cy = Math.max(w.y, Math.min(cat.y, w.y + w.h));
    if (Math.hypot(cat.x - cx, cat.y - cy) < catR) {
      if (cat.weight >= w.need) {
        w.broken = true;
        spawnParticles(w.x + w.w / 2, cat.y, w.color, 30);
        cat.vx *= 0.5;
      } else {
        cat.vx = -Math.abs(cat.vx) - 2;
      }
    }
  }

  let allBroken = true;
  for (let i = 0; i < walls.length; i++) {
    if (!walls[i].broken) { allBroken = false; break; }
  }
  
  if (allBroken && cat.x > canvas.width - 20) {
    win = true;
    addToLeaderboard(currentNickname, cat.weight, true, currentLevel);
    setTimeout(function() { showGameOver(true); }, 1000);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawCat() {
  if (!cat) return;
  const r = getCatRadius();
  const x = cat.x;
  const y = cat.y;
  const wingPhase = cat.wingPhase;
  const hurtTimer = cat.hurtTimer;
  if (hurtTimer > 0 && Math.floor(hurtTimer / 3) % 2 === 0) return;
  const skin = getCurrentSkin();
  const wingY = Math.sin(wingPhase) * 7;
  
  ctx.fillStyle = isDevMode ? '#ff0' : '#fff';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.8, y - r * 0.3 + wingY, r * 0.5, r * 0.3, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - r * 0.8, y - r * 0.3 - wingY, r * 0.5, r * 0.3, 0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = skin.color;
  ctx.lineWidth = r * 0.25;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7, y + r * 0.3);
  ctx.quadraticCurveTo(x - r * 1.4, y + r * 0.1, x - r * 1.2, y - r * 0.3);
  ctx.stroke();

  let bodyColor = skin.color;
  if (skin.id === 'rainbow') {
    bodyColor = 'hsl(' + ((Date.now() * 0.1) % 360) + ', 100%, 65%)';
  }
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.6, y - r * 0.5);
  ctx.lineTo(x - r * 0.3, y - r * 1.2);
  ctx.lineTo(x - r * 0.05, y - r * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.05, y - r * 0.6);
  ctx.lineTo(x + r * 0.3, y - r * 1.2);
  ctx.lineTo(x + r * 0.6, y - r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = '#ff99aa';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.5, y - r * 0.6);
  ctx.lineTo(x - r * 0.3, y - r * 1.0);
  ctx.lineTo(x - r * 0.15, y - r * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.15, y - r * 0.65);
  ctx.lineTo(x + r * 0.3, y - r * 1.0);
  ctx.lineTo(x + r * 0.5, y - r * 0.6);
  ctx.closePath();
  ctx.fill();

  if (isDevMode) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.6, y - r * 1.3);
    ctx.lineTo(x - r * 0.4, y - r * 1.7);
    ctx.lineTo(x - r * 0.1, y - r * 1.4);
    ctx.lineTo(x + r * 0.15, y - r * 1.8);
    ctx.lineTo(x + r * 0.4, y - r * 1.4);
    ctx.lineTo(x + r * 0.6, y - r * 1.7);
    ctx.lineTo(x + r * 0.7, y - r * 1.3);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.18, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.18, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.05, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.05, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b8a';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.08, y + r * 0.05);
  ctx.lineTo(x + r * 0.08, y + r * 0.05);
  ctx.lineTo(x, y + r * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.3, y + r * 0.1);
  ctx.lineTo(x - r * 0.8, y + r * 0.05);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.3, y + r * 0.1);
  ctx.lineTo(x + r * 0.8, y + r * 0.05);
  ctx.stroke();
}

function drawFish(f) {
  const fy = f.y + Math.sin(f.bob) * 3;
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.ellipse(f.x, fy, f.r, f.r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(f.x - f.r, fy);
  ctx.lineTo(f.x - f.r * 1.5, fy - f.r * 0.5);
  ctx.lineTo(f.x - f.r * 1.5, fy + f.r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(f.x + f.r * 0.4, fy - f.r * 0.1, f.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(f.x + f.r * 0.45, fy - f.r * 0.1, f.r * 0.07, 0, Math.PI * 2);
  ctx.fill();
}

function drawWetFood(f) {
  const fy = f.y + Math.sin(f.bob) * 3;
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(f.x - f.r, fy - f.r * 0.8, f.r * 2, f.r * 1.6);
  ctx.fillStyle = '#D2691E';
  ctx.fillRect(f.x - f.r, fy - f.r * 0.8, f.r * 2, f.r * 0.4);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🥫', f.x, fy + 4);
  ctx.textAlign = 'left';
}

function drawSaw(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);
  ctx.fillStyle = '#888';
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const x = Math.cos(angle) * s.r;
    const y = Math.sin(angle) * s.r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    const angle2 = angle + Math.PI / 8;
    ctx.lineTo(Math.cos(angle2) * s.r * 0.7, Math.sin(angle2) * s.r * 0.7);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(0, 0, s.r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCoin(c) {
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#daa520';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawDog(d) {
  if (!d.alive) return;
  ctx.fillStyle = '#a0522d';
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, d.r, d.r * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(d.x + d.r * 0.4, d.y - d.r * 0.2, d.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c00';
  ctx.beginPath();
  ctx.arc(d.x + d.r * 0.45, d.y - d.r * 0.2, d.r * 0.07, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!gameStarted && !win && !death) return;
  
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    const cx = (i * 300 + Date.now() * 0.01) % (canvas.width + 100) - 50;
    ctx.beginPath();
    ctx.arc(cx, 50 + i * 30, 20, 0, Math.PI * 2);
    ctx.arc(cx + 20, 50 + i * 30, 25, 0, Math.PI * 2);
    ctx.arc(cx + 40, 50 + i * 30, 20, 0, Math.PI * 2);
    ctx.fill();
  }
  
  for (let i = 0; i < fishes.length; i++) {
    if (!fishes[i].eaten) drawFish(fishes[i]);
  }
  for (let i = 0; i < wetFoods.length; i++) {
    if (!wetFoods[i].eaten) drawWetFood(wetFoods[i]);
  }
  for (let i = 0; i < saws.length; i++) {
    drawSaw(saws[i]);
  }
  for (let i = 0; i < coins.length; i++) {
    if (!coins[i].collected) drawCoin(coins[i]);
  }
  for (let i = 0; i < dogs.length; i++) {
    if (dogs[i].alive) drawDog(dogs[i]);
  }
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken) continue;
    ctx.fillStyle = w.color;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(w.need + 'кг', w.x + w.w / 2, 20);
    ctx.textAlign = 'left';
  }
  
  drawCat();
  
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 220, 90);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('👤 ' + currentNickname, 20, 30);
  ctx.fillText('🐟 ' + cat.fishes + ' | ⚖ ' + cat.weight.toFixed(0) + 'кг', 20, 50);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('🪙 ' + money, 20, 70);
  ctx.fillStyle = '#aaa';
  ctx.font = '12px sans-serif';
  ctx.fillText('Уровень: ' + currentLevel, 20, 88);
}

document.getElementById('btnSkins').addEventListener('click', function() {
  document.getElementById('skinModal').classList.add('active');
  renderSkinShop();
});

document.getElementById('btnEndings').addEventListener('click', function() {
  renderAchievements();
  document.getElementById('achievementsModal').classList.add('active');
});

document.getElementById('promoBtn').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
  document.getElementById('promoModal').classList.add('active');
});

document.getElementById('promoOk').addEventListener('click', function() {
  const code = document.getElementById('promoInput').value;
  const result = checkPromo(code);
  alert(result.msg);
  if (result.success) {
    document.getElementById('promoModal').classList.remove('active');
  }
});

document.getElementById('promoCancel').addEventListener('click', function() {
  document.getElementById('promoModal').classList.remove('active');
});

document.getElementById('openAdminFromShop').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
  document.getElementById('passwordModal').classList.add('active');
});

document.getElementById('passwordOk').addEventListener('click', function() {
  const val = document.getElementById('passwordInput').value;
  if (val === DEV_PASSWORD) {
    isDevMode = true;
    isImmortal = true;
    money = 9999;
    for (let i = 0; i < SKINS.length; i++) {
      if (ownedSkins.indexOf(SKINS[i].id) === -1) ownedSkins.push(SKINS[i].id);
    }
    saveSkinData();
    document.getElementById('devBadge').classList.add('active');
    document.getElementById('passwordModal').classList.remove('active');
    document.getElementById('adminPanel').classList.add('active');
  } else if (val === ADMIN_PASSWORD) {
    adminUsed = true;
    document.getElementById('passwordModal').classList.remove('active');
    document.getElementById('adminPanel').classList.add('active');
  } else {
    alert('Неверный пароль!');
  }
});

document.getElementById('passwordCancel').addEventListener('click', function() {
  document.getElementById('passwordModal').classList.remove('active');
});

document.getElementById('btnCloseAdmin').addEventListener('click', function() {
  document.getElementById('adminPanel').classList.remove('active');
});

document.getElementById('btnImmortal').addEventListener('click', function() {
  isImmortal = !isImmortal;
  alert(isImmortal ? 'Бессмертие ВКЛ' : 'Бессмертие ВЫКЛ');
});

document.getElementById('btnAddMoney').addEventListener('click', function() {
  money += 100;
  saveSkinData();
});

document.getElementById('btnAddWeight').addEventListener('click', function() {
  cat.weight += 50;
});

document.getElementById('btnBreakWalls').addEventListener('click', function() {
  for (let i = 0; i < walls.length; i++) walls[i].broken = true;
});

document.getElementById('btnKillDogs').addEventListener('click', function() {
  for (let i = 0; i < dogs.length; i++) dogs[i].alive = false;
});

document.getElementById('btnWin').addEventListener('click', function() {
  win = true;
  addToLeaderboard(currentNickname, cat.weight, true, currentLevel);
  showGameOver(true);
});

function renderSkinShop() {
  const grid = document.getElementById('skinsGrid');
  document.getElementById('shopBalance').textContent = money;
  grid.innerHTML = '';
  for (let i = 0; i < SKINS.length; i++) {
    const skin = SKINS[i];
    const isOwned = ownedSkins.indexOf(skin.id) !== -1;
    const isSelected = currentSkinId === skin.id;
    const card = document.createElement('div');
    card.className = 'skin-card' + (isSelected ? ' selected' : '');
    card.innerHTML = '<div class="skin-icon">' + skin.icon + '</div><div class="skin-name">' + skin.name + '</div><div class="skin-price">' + (isOwned ? '✓' : skin.price + '🪙') + '</div>';
    card.onclick = (function(s, owned) {
      return function() {
        if (owned) {
          currentSkinId = s.id;
          saveSkinData();
          renderSkinShop();
        } else if (money >= s.price) {
          money -= s.price;
          ownedSkins.push(s.id);
          currentSkinId = s.id;
          saveSkinData();
          renderSkinShop();
        } else {
          alert('Недостаточно монет!');
        }
      };
    })(skin, isOwned);
    grid.appendChild(card);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
