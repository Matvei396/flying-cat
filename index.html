<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;font-family:sans-serif;color:#fff;overflow:hidden;touch-action:none;position:fixed;width:100%;height:100%}
#startMenu{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#2a2a4e);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000;padding:20px}
#startMenu.hidden{display:none}
.menu-title{font-size:clamp(32px,8vw,72px);font-weight:bold;background:linear-gradient(135deg,#ffd700,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;text-align:center}
.menu-subtitle{font-size:clamp(14px,3vw,20px);color:#aaa;margin-bottom:40px;text-align:center}
.menu-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.menu-btn{padding:16px;font-size:18px;font-weight:bold;border:none;border-radius:12px;cursor:pointer}
.menu-btn.play{background:linear-gradient(135deg,#ffd700,#ffb800);color:#000}
.menu-btn.skins{background:linear-gradient(135deg,#ff6b9d,#ff4081);color:#fff}
.menu-btn.achievements{background:linear-gradient(135deg,#9c27b0,#673ab7);color:#fff}

.nickname-container{position:absolute;bottom:30px;left:20px;right:20px}

#countdown.active{display:flex}

#gameContainer.active{display:block}

#joystick{position:fixed;bottom:80px;left:80px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.2);border:3px solid rgba(255,255,255,0.4);display:none;z-index:100}

.action-buttons{position:fixed;bottom:20px;right:20px;display:none;gap:10px;z-index:100}
.action-buttons.active{display:flex}
.action-btn{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,0.5);border:2px solid #ffd700;color:#fff;font-size:24px;display:flex;justify-content:center;align-items:center}

#gameOverScreen.active{display:flex}

.game-over-title.win{color:#ffd700}
.game-over-title.lose{color:#ff4444}

</style>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const LEADERBOARD_KEY = 'cat_leaderboard_v4';
const NICKNAME_KEY = 'cat_nickname';
let currentNickname = localStorage.getItem(NICKNAME_KEY) || '';
document.getElementById('nicknameInput').value = currentNickname;

document.getElementById('nicknameInput').addEventListener('input', function(e) {
  currentNickname = e.target.value.trim() || 'Игрок';
  localStorage.setItem(NICKNAME_KEY, currentNickname);
});

function getLeaderboard() {
  return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
}

function saveLeaderboard(lb) {
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(lb));
}

function addToLeaderboard(name, weight, isWin) {
  const lb = getLeaderboard();
  lb.push({
    name: name || 'Игрок',
    weight: Math.round(weight),
    win: isWin,
    date: new Date().toLocaleDateString('ru-RU')
  });
  lb.sort(function(a, b) { return b.weight - a.weight; });
  saveLeaderboard(lb.slice(0, 10));
}

const ENDINGS = {
  death: { id: 'death', title: 'Смерть', desc: 'Собаки победили', icon: '💀', unlocked: false },
  normal: { id: 'normal', title: 'Победитель', desc: 'Пробила все стены', icon: '🏆', unlocked: false },
  admin: { id: 'admin', title: 'Читер', desc: 'Использовала админку', icon: '🛠', unlocked: false },
  noFood: { id: 'noFood', title: 'Диетолог', desc: 'Победила без рыбок', icon: '🥗', unlocked: false }
};

const ENDINGS_KEY = 'cat_endings_v4';

function loadEndings() {
  const saved = localStorage.getItem(ENDINGS_KEY);
  if (saved) {
    const data = JSON.parse(saved);
    for (const key in data) {
      if (ENDINGS[key]) ENDINGS[key].unlocked = data[key];
    }
  }
}

function saveEndings() {
  const data = {};
  for (const key in ENDINGS) {
    data[key] = ENDINGS[key].unlocked;
  }
  localStorage.setItem(ENDINGS_KEY, JSON.stringify(data));
}

function unlockEnding(id) {
  if (ENDINGS[id] && !ENDINGS[id].unlocked) {
    ENDINGS[id].unlocked = true;
    saveEndings();
  }
}

loadEndings();

let gameStarted = false;
let currentEnding = null;

document.getElementById('btnPlay').addEventListener('click', function() {
  if (!currentNickname) {
    currentNickname = 'Игрок';
    localStorage.setItem(NICKNAME_KEY, currentNickname);
  }
  startCountdown();
});

document.getElementById('btnSkinsMenu').addEventListener('click', function() {
  document.getElementById('skinModal').classList.add('active');
  renderSkinShop();
});

document.getElementById('btnAchievementsMenu').addEventListener('click', function() {
  renderAchievements();
  document.getElementById('achievementsModal').classList.add('active');
});

document.getElementById('btnLeaderboard').addEventListener('click', function() {
  renderLeaderboard();
  document.getElementById('leaderboardModal').classList.add('active');
});

document.getElementById('closeSkinShop').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
});

document.getElementById('closeAchievements').addEventListener('click', function() {
  document.getElementById('achievementsModal').classList.remove('active');
});

document.getElementById('closeLeaderboard').addEventListener('click', function() {
  document.getElementById('leaderboardModal').classList.remove('active');
});

function renderAchievements() {
  const list = document.getElementById('achievementsList');
  list.innerHTML = '';
  for (const key in ENDINGS) {
    const e = ENDINGS[key];
    const item = document.createElement('div');
    item.className = 'achievement-item ' + (e.unlocked ? 'unlocked' : 'locked');
    item.innerHTML = '<div class="achievement-icon">' + (e.unlocked ? e.icon : '🔒') + '</div><div class="achievement-info"><div class="achievement-title">' + (e.unlocked ? e.title : '???') + '</div><div class="achievement-desc">' + (e.unlocked ? e.desc : 'Ещё не получено') + '</div></div>';
    list.appendChild(item);
  }
}

function renderLeaderboard() {
  const lb = getLeaderboard();
  const content = document.getElementById('leaderboardContent');
  if (lb.length === 0) {
    content.innerHTML = '<div style="text-align:center;color:#666;padding:30px">Пока нет рекордов</div>';
    return;
  }
  let html = '<table style="width:100%;border-collapse:collapse">';
  for (let i = 0; i < lb.length; i++) {
    const entry = lb[i];
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    html += '<tr><td style="padding:8px;border-bottom:1px solid #333">' + medal + '</td><td style="padding:8px;border-bottom:1px solid #333">' + entry.name + '</td><td style="padding:8px;border-bottom:1px solid #333">' + entry.weight + 'кг</td><td style="padding:8px;border-bottom:1px solid #333">' + (entry.win ? '✅' : '❌') + '</td></tr>';
  }
  html += '</table>';
  content.innerHTML = html;
}

function startCountdown() {
  document.getElementById('startMenu').classList.add('hidden');
  document.getElementById('gameContainer').classList.add('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  const countdownEl = document.getElementById('countdown');
  const textEl = document.getElementById('countdownText');
  countdownEl.classList.add('active');
  
  let count = 3;
  textEl.textContent = count;
  
  const interval = setInterval(function() {
    count--;
    if (count > 0) {
      textEl.textContent = count;
    } else if (count === 0) {
      textEl.textContent = 'GO!';
      textEl.className = 'countdown-number go';
    } else {
      clearInterval(interval);
      countdownEl.classList.remove('active');
      gameStarted = true;
      document.getElementById('joystick').classList.add('active');
      document.getElementById('actionButtons').classList.add('active');
      initGame();
    }
  }, 1000);
}

function showGameOver(isWin) {
  gameStarted = false;
  document.getElementById('joystick').classList.remove('active');
  document.getElementById('actionButtons').classList.remove('active');
  
  const title = document.getElementById('gameOverTitle');
  const stats = document.getElementById('gameOverStats');
  
  if (isWin) {
    title.textContent = '🏆 ПОБЕДА! 🏆';
    title.className = 'game-over-title win';
  } else {
    title.textContent = '💀 ПОРАЖЕНИЕ 💀';
    title.className = 'game-over-title lose';
  }
  
  stats.innerHTML = 'Ник: ' + currentNickname + '<br>Вес: ' + Math.round(cat.weight) + ' кг<br>Рыбок: ' + cat.fishes;
  
  document.getElementById('gameOverScreen').classList.add('active');
}

document.getElementById('btnRestart').addEventListener('click', function() {
  document.getElementById('gameOverScreen').classList.remove('active');
  startCountdown();
});

document.getElementById('btnToMenu').addEventListener('click', function() {
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('gameContainer').classList.remove('active');
  document.getElementById('startMenu').classList.remove('hidden');
  gameStarted = false;
});

const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystickKnob');
let joystickActive = false;
let joystickX = 0, joystickY = 0;

joystick.addEventListener('touchstart', function(e) {
  e.preventDefault();
  joystickActive = true;
});

joystick.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!joystickActive) return;
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const touch = e.touches[0];
  let dx = touch.clientX - centerX;
  let dy = touch.clientY - centerY;
  const distance = Math.min(Math.hypot(dx, dy), 50);
  const angle = Math.atan2(dy, dx);
  dx = Math.cos(angle) * distance;
  dy = Math.sin(angle) * distance;
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  joystickX = dx / 50;
  joystickY = dy / 50;
});

joystick.addEventListener('touchend', function(e) {
  e.preventDefault();
  joystickActive = false;
  knob.style.transform = 'translate(0,0)';
  joystickX = 0;
  joystickY = 0;
});

let isDevMode = false;
let isImmortal = false;
const DEV_PASSWORD = 'plm987okn';
const ADMIN_PASSWORD = '1488';

const PROMOS_KEY = 'cat_used_promos_v3';
let usedPromos = JSON.parse(localStorage.getItem(PROMOS_KEY) || '[]');

function checkPromo(code) {
  code = code.trim().toLowerCase();
  if (code === 'spider man') {
    if (usedPromos.indexOf('spiderman') !== -1) return { success: false, msg: 'Уже использован!' };
    if (ownedSkins.indexOf('spiderman') === -1) ownedSkins.push('spiderman');
    currentSkinId = 'spiderman';
    saveSkinData();
    usedPromos.push('spiderman');
    localStorage.setItem(PROMOS_KEY, JSON.stringify(usedPromos));
    return { success: true, msg: 'Скин Человек-Паук! 🕷️' };
  }
  if (code === '500money') {
    if (usedPromos.indexOf('500money') !== -1) return { success: false, msg: 'Уже использован!' };
    money += 500;
    saveSkinData();
    usedPromos.push('500money');
    localStorage.setItem(PROMOS_KEY, JSON.stringify(usedPromos));
    return { success: true, msg: '+500 монет! 💰' };
  }
  if (code === '1488монет') {
    if (usedPromos.indexOf('1488монет') !== -1) return { success: false, msg: 'Уже использован!' };
    money += 1488;
    saveSkinData();
    usedPromos.push('1488монет');
    localStorage.setItem(PROMOS_KEY, JSON.stringify(usedPromos));
    return { success: true, msg: '+1488 монет! 💰' };
  }
  return { success: false, msg: 'Неверный код!' };
}

const SKINS = [
  { id: 'default', name: 'Обычная', icon: '🐱', price: 0, color: '#ff9933' },
  { id: 'cool', name: 'Крутая', icon: '😎', price: 50, color: '#ff9933' },
  { id: 'alien', name: 'Пришелец', icon: '👽', price: 100, color: '#9acd32' },
  { id: 'robot', name: 'Робот', icon: '🤖', price: 200, color: '#778899' },
  { id: 'pumpkin', name: 'Тыква', icon: '🎃', price: 150, color: '#ff7518' },
  { id: 'rainbow', name: 'Радуга', icon: '🌈', price: 300, color: 'rainbow' },
  { id: 'ghost', name: 'Призрак', icon: '👻', price: 250, color: '#e0e0ff' },
  { id: 'santa', name: 'Санта', icon: '', price: 350, color: '#ff9933' },
  { id: 'hero', name: 'Герой', icon: '🦸', price: 400, color: '#4169e1' },
  { id: 'fish', name: 'Рыбка', icon: '🐟', price: 180, color: '#87ceeb' },
  { id: 'diamond', name: 'Алмаз', icon: '💎', price: 500, color: '#b9f2ff' },
  { id: 'star', name: 'Звёздная', icon: '', price: 450, color: '#fff8dc' },
  { id: 'spiderman', name: 'Паук', icon: '🕷️', price: 9999, color: '#cc0000' }
];

let money = parseInt(localStorage.getItem('cat_money') || '0', 10);
let ownedSkins = JSON.parse(localStorage.getItem('cat_owned_skins') || '["default"]');
let currentSkinId = localStorage.getItem('cat_current_skin') || 'default';

function saveSkinData() {
  localStorage.setItem('cat_money', money);
  localStorage.setItem('cat_owned_skins', JSON.stringify(ownedSkins));
  localStorage.setItem('cat_current_skin', currentSkinId);
}

function getCurrentSkin() {
  for (let i = 0; i < SKINS.length; i++) {
    if (SKINS[i].id === currentSkinId) return SKINS[i];
  }
  return SKINS[0];
}

let cat, fishes, coins, dogs, walls, particles, win, death;
let adminUsed = false;
const DOG_EAT_THRESHOLD = 50;

function initGame() {
  cat = {
    x: canvas.width * 0.1,
    y: canvas.height / 2,
    vx: 0, vy: 0,
    weight: 25, fishes: 0,
    wingPhase: 0, hurtTimer: 0, dogHits: 0
  };
  fishes = [];
  for (let i = 0; i < 20; i++) {
    fishes.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.65,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 14, bob: Math.random() * Math.PI * 2, eaten: false
    });
  }
  coins = [];
  for (let i = 0; i < 15; i++) {
    coins.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.7,
      y: 50 + Math.random() * (canvas.height - 100),
      r: 10, collected: false
    });
  }
  dogs = [
    { x: canvas.width * 0.3, y: canvas.height * 0.2, vx: 1.5, vy: 0.8, r: 18, cooldown: 0, dir: 1, phase: 0, alive: true },
    { x: canvas.width * 0.5, y: canvas.height * 0.7, vx: -1.2, vy: 1.0, r: 20, cooldown: 0, dir: -1, phase: 2, alive: true },
    { x: canvas.width * 0.2, y: canvas.height * 0.5, vx: 0.9, vy: -1.3, r: 16, cooldown: 0, dir: 1, phase: 4, alive: true }
  ];
  walls = [
    { x: canvas.width * 0.8, y: 0, w: 15, h: canvas.height, need: 50, color: '#8B4513', broken: false, id: 1 },
    { x: canvas.width * 0.85, y: 0, w: 15, h: canvas.height, need: 100, color: '#666', broken: false, id: 2 },
    { x: canvas.width * 0.9, y: 0, w: 15, h: canvas.height, need: 150, color: '#222', broken: false, id: 3 }
  ];
  particles = [];
  win = false;
  death = false;
  adminUsed = false;
  currentEnding = null;
}

function getCatRadius() {
  return 20 + cat.weight * 0.2;
}

function spawnParticles(x, y, color, count) {
  count = count || 12;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 25 + Math.random() * 15,
      maxLife: 40,
      color: color,
      size: 2 + Math.random() * 4
    });
  }
}

function update() {
  if (!gameStarted || win || death) return;
  
  const catR = getCatRadius();
  const speed = 0.5;
  
  cat.vx += joystickX * speed;
  cat.vy += joystickY * speed;
  cat.vx *= 0.92;
  cat.vy *= 0.92;
  cat.x += cat.vx;
  cat.y += cat.vy;
  
  if (cat.x - catR < 0) { cat.x = catR; cat.vx = 0; }
  if (cat.y - catR < 0) { cat.y = catR; cat.vy = 0; }
  if (cat.y + catR > canvas.height) { cat.y = canvas.height - catR; cat.vy = 0; }
  
  cat.wingPhase += 0.3;
  if (cat.hurtTimer > 0) cat.hurtTimer--;

  for (let i = 0; i < fishes.length; i++) {
    const f = fishes[i];
    if (f.eaten) continue;
    f.bob += 0.08;
    if (Math.hypot(f.x - cat.x, f.y - cat.y) < catR + f.r) {
      f.eaten = true;
      cat.fishes++;
      cat.weight += 5;
      spawnParticles(f.x, f.y, '#ffcc33', 10);
    }
  }

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected) continue;
    if (Math.hypot(c.x - cat.x, c.y - cat.y) < catR + c.r) {
      c.collected = true;
      money++;
      saveSkinData();
      spawnParticles(c.x, c.y, '#ffd700', 8);
    }
  }

  for (let i = 0; i < dogs.length; i++) {
    const d = dogs[i];
    if (!d.alive) continue;
    d.phase += 0.02;
    const toCatX = cat.x - d.x;
    const toCatY = cat.y - d.y;
    const dist = Math.hypot(toCatX, toCatY) || 1;
    d.vx += (toCatX / dist) * 0.03 + Math.sin(d.phase) * 0.05;
    d.vy += (toCatY / dist) * 0.03 + Math.cos(d.phase * 1.3) * 0.05;
    d.vx *= 0.97;
    d.vy *= 0.97;
    const spd = Math.hypot(d.vx, d.vy);
    if (spd > 2.5) { d.vx *= 2.5 / spd; d.vy *= 2.5 / spd; }
    d.x += d.vx;
    d.y += d.vy;
    d.dir = d.vx >= 0 ? 1 : -1;
    
    if (d.x < d.r) { d.x = d.r; d.vx *= -1; }
    if (d.x > canvas.width * 0.75) { d.x = canvas.width * 0.75; d.vx *= -1; }
    if (d.y < d.r) { d.y = d.r; d.vy *= -1; }
    if (d.y > canvas.height - d.r) { d.y = canvas.height - d.r; d.vy *= -1; }
    
    if (d.cooldown > 0) d.cooldown--;
    if (d.cooldown <= 0 && Math.hypot(d.x - cat.x, d.y - cat.y) < catR + d.r) {
      if (cat.weight >= DOG_EAT_THRESHOLD) {
        d.alive = false;
        cat.weight += 15;
        spawnParticles(d.x, d.y, '#ff6600', 20);
      } else {
        if (isImmortal) {
          d.vx = -d.vx * 3;
          d.vy = -d.vy * 3;
          d.cooldown = 30;
          spawnParticles(cat.x, cat.y, '#64c8ff', 6);
        } else {
          if (cat.fishes > 0) {
            cat.fishes--;
            cat.weight = Math.max(25, cat.weight - 5);
            spawnParticles(cat.x, cat.y, '#ff4444', 8);
          }
          cat.hurtTimer = 20;
          cat.dogHits++;
          d.cooldown = 60;
          d.vx = -d.vx * 3;
          d.vy = -d.vy * 3;
          if (cat.dogHits >= 5) {
            death = true;
            unlockEnding('death');
            addToLeaderboard(currentNickname, cat.weight, false);
            currentEnding = 'death';
            setTimeout(function() { showGameOver(false); }, 1500);
          }
        }
      }
    }
  }

  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken) continue;
    const cx = Math.max(w.x, Math.min(cat.x, w.x + w.w));
    const cy = Math.max(w.y, Math.min(cat.y, w.y + w.h));
    if (Math.hypot(cat.x - cx, cat.y - cy) < catR) {
      if (cat.weight >= w.need) {
        w.broken = true;
        spawnParticles(w.x + w.w / 2, cat.y, w.color, 30);
        cat.vx *= 0.5;
      } else {
        cat.vx = -Math.abs(cat.vx) - 2;
      }
    }
  }

  let allBroken = true;
  for (let i = 0; i < walls.length; i++) {
    if (!walls[i].broken) { allBroken = false; break; }
  }
  
  if (allBroken && cat.x > canvas.width - 20) {
    win = true;
    if (adminUsed) {
      unlockEnding('admin');
      currentEnding = 'admin';
    } else if (cat.fishes === 0) {
      unlockEnding('noFood');
      currentEnding = 'noFood';
    } else {
      unlockEnding('normal');
      currentEnding = 'normal';
    }
    addToLeaderboard(currentNickname, cat.weight, true);
    setTimeout(function() { showGameOver(true); }, 1000);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawCat() {
  if (!cat) return;
  const r = getCatRadius();
  const x = cat.x;
  const y = cat.y;
  const wingPhase = cat.wingPhase;
  const hurtTimer = cat.hurtTimer;
  if (hurtTimer > 0 && Math.floor(hurtTimer / 3) % 2 === 0) return;
  const skin = getCurrentSkin();
  const wingY = Math.sin(wingPhase) * 7;
  
  ctx.fillStyle = isDevMode ? '#ff0' : '#fff';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.8, y - r * 0.3 + wingY, r * 0.5, r * 0.3, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - r * 0.8, y - r * 0.3 - wingY, r * 0.5, r * 0.3, 0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = skin.color;
  ctx.lineWidth = r * 0.25;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7, y + r * 0.3);
  ctx.quadraticCurveTo(x - r * 1.4, y + r * 0.1, x - r * 1.2, y - r * 0.3);
  ctx.stroke();

  let bodyColor = skin.color;
  if (skin.id === 'rainbow') {
    bodyColor = 'hsl(' + ((Date.now() * 0.1) % 360) + ', 100%, 65%)';
  }
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.6, y - r * 0.5);
  ctx.lineTo(x - r * 0.3, y - r * 1.2);
  ctx.lineTo(x - r * 0.05, y - r * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.05, y - r * 0.6);
  ctx.lineTo(x + r * 0.3, y - r * 1.2);
  ctx.lineTo(x + r * 0.6, y - r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = '#ff99aa';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.5, y - r * 0.6);
  ctx.lineTo(x - r * 0.3, y - r * 1.0);
  ctx.lineTo(x - r * 0.15, y - r * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.15, y - r * 0.65);
  ctx.lineTo(x + r * 0.3, y - r * 1.0);
  ctx.lineTo(x + r * 0.5, y - r * 0.6);
  ctx.closePath();
  ctx.fill();

  if (isDevMode) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.6, y - r * 1.3);
    ctx.lineTo(x - r * 0.4, y - r * 1.7);
    ctx.lineTo(x - r * 0.1, y - r * 1.4);
    ctx.lineTo(x + r * 0.15, y - r * 1.8);
    ctx.lineTo(x + r * 0.4, y - r * 1.4);
    ctx.lineTo(x + r * 0.6, y - r * 1.7);
    ctx.lineTo(x + r * 0.7, y - r * 1.3);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.18, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.18, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.3, y - r * 0.1, r * 0.05, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + r * 0.3, y - r * 0.1, r * 0.05, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b8a';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.08, y + r * 0.05);
  ctx.lineTo(x + r * 0.08, y + r * 0.05);
  ctx.lineTo(x, y + r * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.3, y + r * 0.1);
  ctx.lineTo(x - r * 0.8, y + r * 0.05);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + r * 0.3, y + r * 0.1);
  ctx.lineTo(x + r * 0.8, y + r * 0.05);
  ctx.stroke();
}

function drawFish(f) {
  const fy = f.y + Math.sin(f.bob) * 3;
  ctx.fillStyle = '#ff6b9d';
  ctx.beginPath();
  ctx.ellipse(f.x, fy, f.r, f.r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(f.x - f.r, fy);
  ctx.lineTo(f.x - f.r * 1.5, fy - f.r * 0.5);
  ctx.lineTo(f.x - f.r * 1.5, fy + f.r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(f.x + f.r * 0.4, fy - f.r * 0.1, f.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(f.x + f.r * 0.45, fy - f.r * 0.1, f.r * 0.07, 0, Math.PI * 2);
  ctx.fill();
}

function drawCoin(c) {
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#daa520';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawDog(d) {
  if (!d.alive) return;
  ctx.fillStyle = '#a0522d';
  ctx.beginPath();
  ctx.ellipse(d.x, d.y, d.r, d.r * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(d.x + d.r * 0.4, d.y - d.r * 0.2, d.r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c00';
  ctx.beginPath();
  ctx.arc(d.x + d.r * 0.45, d.y - d.r * 0.2, d.r * 0.07, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!gameStarted && !win && !death) return;
  
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    const cx = (i * 300 + Date.now() * 0.01) % (canvas.width + 100) - 50;
    ctx.beginPath();
    ctx.arc(cx, 50 + i * 30, 20, 0, Math.PI * 2);
    ctx.arc(cx + 20, 50 + i * 30, 25, 0, Math.PI * 2);
    ctx.arc(cx + 40, 50 + i * 30, 20, 0, Math.PI * 2);
    ctx.fill();
  }
  
  for (let i = 0; i < fishes.length; i++) {
    if (!fishes[i].eaten) drawFish(fishes[i]);
  }
  for (let i = 0; i < coins.length; i++) {
    if (!coins[i].collected) drawCoin(coins[i]);
  }
  for (let i = 0; i < dogs.length; i++) {
    if (dogs[i].alive) drawDog(dogs[i]);
  }
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (w.broken) continue;
    ctx.fillStyle = w.color;
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }
  
  drawCat();
  
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 200, 80);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('👤 ' + currentNickname, 20, 30);
  ctx.fillText('🐟 ' + cat.fishes + ' | ⚖ ' + cat.weight.toFixed(0) + 'кг', 20, 50);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('🪙 ' + money, 20, 70);
}

document.getElementById('btnSkins').addEventListener('click', function() {
  document.getElementById('skinModal').classList.add('active');
  renderSkinShop();
});

document.getElementById('btnEndings').addEventListener('click', function() {
  renderAchievements();
  document.getElementById('achievementsModal').classList.add('active');
});

document.getElementById('promoBtn').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
  document.getElementById('promoModal').classList.add('active');
});

document.getElementById('promoOk').addEventListener('click', function() {
  const code = document.getElementById('promoInput').value;
  const result = checkPromo(code);
  alert(result.msg);
  if (result.success) {
    document.getElementById('promoModal').classList.remove('active');
  }
});

document.getElementById('promoCancel').addEventListener('click', function() {
  document.getElementById('promoModal').classList.remove('active');
});

document.getElementById('openAdminFromShop').addEventListener('click', function() {
  document.getElementById('skinModal').classList.remove('active');
  document.getElementById('passwordModal').classList.add('active');
});

document.getElementById('passwordOk').addEventListener('click', function() {
  const val = document.getElementById('passwordInput').value;
  if (val === DEV_PASSWORD) {
    isDevMode = true;
    isImmortal = true;
    money = 9999;
    for (let i = 0; i < SKINS.length; i++) {
      if (ownedSkins.indexOf(SKINS[i].id) === -1) ownedSkins.push(SKINS[i].id);
    }
    saveSkinData();
    document.getElementById('devBadge').classList.add('active');
    document.getElementById('passwordModal').classList.remove('active');
    document.getElementById('adminPanel').classList.add('active');
  } else if (val === ADMIN_PASSWORD) {
    adminUsed = true;
    document.getElementById('passwordModal').classList.remove('active');
    document.getElementById('adminPanel').classList.add('active');
  } else {
    alert('Неверный пароль!');
  }
});

document.getElementById('passwordCancel').addEventListener('click', function() {
  document.getElementById('passwordModal').classList.remove('active');
});

document.getElementById('btnCloseAdmin').addEventListener('click', function() {
  document.getElementById('adminPanel').classList.remove('active');
});

document.getElementById('btnImmortal').addEventListener('click', function() {
  isImmortal = !isImmortal;
  alert(isImmortal ? 'Бессмертие ВКЛ' : 'Бессмертие ВЫКЛ');
});

document.getElementById('btnAddMoney').addEventListener('click', function() {
  money += 100;
  saveSkinData();
});

document.getElementById('btnAddWeight').addEventListener('click', function() {
  cat.weight += 50;
});

document.getElementById('btnBreakWalls').addEventListener('click', function() {
  for (let i = 0; i < walls.length; i++) walls[i].broken = true;
});

document.getElementById('btnKillDogs').addEventListener('click', function() {
  for (let i = 0; i < dogs.length; i++) dogs[i].alive = false;
});

document.getElementById('btnWin').addEventListener('click', function() {
  win = true;
  unlockEnding('admin');
  currentEnding = 'admin';
  addToLeaderboard(currentNickname, cat.weight, true);
  showGameOver(true);
});

function renderSkinShop() {
  const grid = document.getElementById('skinsGrid');
  document.getElementById('shopBalance').textContent = money;
  grid.innerHTML = '';
  for (let i = 0; i < SKINS.length; i++) {
    const skin = SKINS[i];
    const isOwned = ownedSkins.indexOf(skin.id) !== -1;
    const isSelected = currentSkinId === skin.id;
    const card = document.createElement('div');
    card.className = 'skin-card' + (isSelected ? ' selected' : '');
    card.innerHTML = '<div class="skin-icon">' + skin.icon + '</div><div class="skin-name">' + skin.name + '</div><div class="skin-price">' + (isOwned ? '✓' : skin.price + '🪙') + '</div>';
    card.onclick = (function(s, owned) {
      return function() {
        if (owned) {
          currentSkinId = s.id;
          saveSkinData();
          renderSkinShop();
        } else if (money >= s.price) {
          money -= s.price;
          ownedSkins.push(s.id);
          currentSkinId = s.id;
          saveSkinData();
          renderSkinShop();
        } else {
          alert('Недостаточно монет!');
        }
      };
    })(skin, isOwned);
    grid.appendChild(card);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
